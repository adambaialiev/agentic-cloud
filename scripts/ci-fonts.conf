<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  WHAT THE BROWSER CHECKS RENDER IN, decided rather than inherited.

  Every `verify-*` harness and every journey asserts about a screen, and a
  screen is mostly text: row heights, whether a line wraps, whether a label
  fits beside a number. All of those are font metrics. Until this file, the
  font was whatever the machine happened to ship — an accident of the base
  image, different between a lane-A machine and a workbench, and free to
  change under us on any image bump. A whole suite going red with nobody
  having touched a line of code is the failure this prevents.

  Liberation Sans, because it is metric-compatible with Arial (so the numbers
  mean something outside this repo), it is one small package, and it is what
  a workbench already resolves — which is the point: green here should predict
  green in CI.

  THE `Segoe UI` AND `Roboto` LINES ARE NOT PADDING. The Workspace asks for
  `-apple-system, system-ui, "Segoe UI", Roboto, sans-serif`, and on a machine
  holding none of those, fontconfig substitutes the middle two with LIBERATION
  SERIF — measured with Chrome's own `CSS.getPlatformFontsForNode`, not
  guessed. Today `system-ui` resolves first and hides it; the day a machine
  ships without whatever `system-ui` lands on, the entire Workspace renders in
  a serif and every width assertion in the suite moves at once.

  To render the same thing on a workbench:
    mkdir -p ~/.config/fontconfig/conf.d
    cp scripts/ci-fonts.conf ~/.config/fontconfig/conf.d/99-agentbuilt-pin.conf
-->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Roboto</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
