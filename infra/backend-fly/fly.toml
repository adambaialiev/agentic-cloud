# Production's backend (note #1032, stage 4). One always-on machine; the
# database, releases and env file live on the volume (see entrypoint.sh).
# Two backends must never run at once: keep exactly one machine.
app = "ia-control"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = 35

[mounts]
  source = "ia_control_data"
  destination = "/data"
  initial_size = "20gb"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 1000
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
