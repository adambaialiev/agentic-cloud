    <!-- Somebody whose browser is already signed in did not come to the front
         page to be sold the product they are using: the root address sends
         them straight into the Workspace (note #526).

         Inline, and in the <head>, on purpose. Every public route here ships
         prerendered (scripts/prerender.mjs), so the real landing markup is in
         the document and paints as soon as the body is parsed — a redirect
         decided after the module bundle has downloaded and hydrated would
         show the page first and then snatch it away. This runs before the
         body exists, so nothing is drawn to take back.

         The signal is the CSRF cookie the backend sets beside the HttpOnly
         session one (services/workspace-web-session.ts). It is deliberately
         readable by JavaScript, it is set and cleared with the session, and
         it is worth nothing to anyone who reads it here. Nothing is fetched
         to ask: a signed-out visitor — and every crawler, which carries no
         cookies at all — pays no round trip and gets the page it asked for.

         This file is the template for EVERY prerendered route, hence the
         exact `/` test: only the root address is the one being spoken about.
         `?stay` opens it anyway, which is how a signed-in person reads their
         own marketing page. `replace` rather than `assign` keeps the address
         being left out of history, so Back does not bounce off it again. -->
    <script>
      (function () {
        if (location.pathname !== '/') return;
        if (new URLSearchParams(location.search).has('stay')) return;
        if (!/(?:^|;\s*)(?:__Host-acc_csrf|acc_csrf)=[^;\s]/.test(document.cookie || '')) return;
        location.replace('/login');
      })();
    </script>

    <!-- The site's one webfont: Inter, subset to latin, one variable file for
         every weight it uses, served from this origin. Preloaded because the
         browser cannot see it until it has parsed the stylesheet, by which
         time the first paint is already drawn in the fallback; `crossorigin`
         is required even same-origin or the preload is fetched twice. It does
         not block that paint — `font-display: swap` in index.css, over a
         metric-matched Arial so the swap does not move a line. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
