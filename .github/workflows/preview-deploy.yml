name: Preview Deployment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: [self-hosted, linux, x64]
    name: Deploy Preview to Cloudflare Pages
    
    # Grant write permissions for commenting on PRs
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
        env:
          # Preview API base URL from GitHub Secrets
          VITE_API_BASE_URL: ${{ secrets.PREVIEW_API_BASE_URL }}
      
      - name: Deploy to Cloudflare Pages (Preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=infinite-agents --branch=preview-${{ github.event.pull_request.number }}
      
      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            // Check if PR is from a fork (cross-repository PR)
            // Forks may not have write permissions even with token
            const isFork = context.payload.pull_request.head.repo.full_name !== context.payload.pull_request.base.repo.full_name;
            
            if (isFork) {
              console.log('Skipping PR comment for fork PR (no write permissions)');
              return;
            }
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '🚀 Preview deployment ready! The preview will be available shortly on Cloudflare Pages.'
              });
              console.log('Successfully commented on PR');
            } catch (error) {
              console.error('Failed to comment on PR:', error.message);
              // Don't fail the workflow if commenting fails
            }
